[project]
name = "async-typer"
version = "0.2.1"
description = "Typer with first-class async support: unified sync/async commands, callbacks, and lifecycle event handlers."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE.txt" }
authors = [
    { name = "byunjuneseok", email = "byunjuneseok@gmail.com" },
]
keywords = ["typer", "async", "cli", "asyncio"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "typer>=0.9.0,<1.0.0",
]

[project.urls]
Homepage = "https://github.com/byunjuneseok/async-typer"
Repository = "https://github.com/byunjuneseok/async-typer"
"Bug Tracker" = "https://github.com/byunjuneseok/async-typer/issues"


[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ty>=0.0.1a20",
    "ruff>=0.6",
]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["async_typer"]

[tool.hatch.build.targets.sdist]
include = [
    "async_typer",
    "tests",
    "README.md",
    "LICENSE.txt",
]


# --- tooling ------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B", "SIM"]

[tool.ty.src]
include = ["async_typer", "tests"]

[tool.ty.environment]
python-version = "3.11"

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = [
    "error",
    # DeprecationWarning for async_command/async_callback aliases is asserted
    # explicitly in tests via `pytest.warns(DeprecationWarning)`.
]
