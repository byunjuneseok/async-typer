name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: py${{ matrix.python-version }} / typer ${{ matrix.typer-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        # async-typer mirrors the typer version it targets, so this axis lists
        # every typer release the current version claims to support. Keep it in
        # sync with the `typer` constraint in pyproject.toml.
        typer-version: ["0.27.2"]
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --dev

      - name: Pin typer ${{ matrix.typer-version }}
        run: uv pip install "typer==${{ matrix.typer-version }}"

      - name: Lint
        run: uv run --no-sync ruff check .

      - name: Type check
        run: uv run --no-sync ty check

      - name: Test
        run: uv run --no-sync pytest
